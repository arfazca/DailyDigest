name: Sync Concept2

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Full Concept2 sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONCEPT2_TOKEN: ${{ secrets.CONCEPT2_TOKEN }}
        run: python scripts/setup_concept2.py
