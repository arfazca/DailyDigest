name: Daily Digest

# cron-job.org fires this hourly through the workflow-dispatch API
# (docs/cronjob-setup.md), so workflow_dispatch is BOTH the scheduled path and
# the manual one. Nothing may treat the event type as "the user asked for a
# digest" — digest.py decides that from the clock and the inbox.
on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FORWARD_EMAILS: ${{ secrets.FORWARD_EMAILS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ICS_URL: ${{ secrets.ICS_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          BIRTHDATE: ${{ secrets.BIRTHDATE }}
          WEATHER_LAT: ${{ secrets.WEATHER_LAT }}
          WEATHER_LON: ${{ secrets.WEATHER_LON }}
          CONCEPT2_TOKEN: ${{ secrets.CONCEPT2_TOKEN }}
          TIMEZONE: America/Vancouver
        run: python scripts/digest.py
